# One file for the whole app: docker compose up --build
# Frontend http://localhost:3000, backend http://localhost:8000
# The database is SQLite, so "db" is a file on the db-data volume (it survives restarts).

services:
  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY app ./app
        CMD ["sh", "-c", "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: sqlite:////data/reimbursement.db
    volumes:
      - db-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000 # baked in at build time; the browser calls this address
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        ARG NEXT_PUBLIC_API_URL
        ENV NEXT_PUBLIC_API_URL=$$NEXT_PUBLIC_API_URL
        RUN npm run build
        CMD ["npm", "start"]
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
